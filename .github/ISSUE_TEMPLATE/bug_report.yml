name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Setup printer with '...'
        2. Call printRawData(...)
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: Minimal code that reproduces the issue.
      render: typescript

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: paper_width
    attributes:
      label: Paper Width
      options:
        - 58mm
        - 80mm
        - Both

  - type: input
    id: electron_version
    attributes:
      label: Electron Version
      placeholder: e.g. 34.0.0
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Package Version
      placeholder: e.g. 1.0.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Any relevant error messages or logs.
      render: shell
